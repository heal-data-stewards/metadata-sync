name: Deploy Lambdas on Merge

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'mysql_tables_sync_lambda/**'
      - 'query_mysql_tables_lambda/**'
      # - 'src/function-c/**'   # Add all your Lambda folders here

permissions:
  id-token: write             # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1                                                    # Your AWS region
  AWS_ROLE_ARN: arn:aws:iam::339712780658:role/github-actions-metadata-sync-role   # Your IAM role ARN

jobs:
  # Determines which Lambda directory actually changed, using a real
  # before/after git diff (dorny/paths-filter) rather than github.event.commits,
  # which is unreliable (often empty) for branch-creation pushes, squash
  # merges, or pushes over 20 commits — see the deploy-lambdas.yml history for
  # why that approach kept causing jobs to skip.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mysql_tables_sync: ${{ steps.filter.outputs.mysql_tables_sync }}
      query_mysql_tables: ${{ steps.filter.outputs.query_mysql_tables }}
      # function_c: ${{ steps.filter.outputs.function_c }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mysql_tables_sync:
              - 'mysql_tables_sync_lambda/**'
            query_mysql_tables:
              - 'query_mysql_tables_lambda/**'
            # function_c:
            #   - 'src/function-c/**'   # Add a filter entry per Lambda folder

  # develop -> mysql_tables_sync_test, main -> mysql_tables_sync (production)
  deploy-mysql-tables-sync:
    needs: changes
    if: needs.changes.outputs.mysql_tables_sync == 'true'
    runs-on: ubuntu-latest
    # Only the main/production path is gated — this resolves to empty (no
    # environment, no approval pause) for develop, and to "production" (whose
    # required-reviewer rule is configured in Settings > Environments) for main.
    environment: ${{ github.ref_name == 'main' && 'production' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine target function
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "FUNCTION_NAME=mysql_tables_sync" >> "$GITHUB_ENV"
          else
            echo "FUNCTION_NAME=mysql_tables_sync_test" >> "$GITHUB_ENV"
          fi

      - name: Package Lambda
        run: |
          cd 'mysql_tables_sync_lambda/'
          zip -r ../mysql_tables_sync_lambda.zip .

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://mysql_tables_sync_lambda.zip

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

  # develop -> query_mysql_tables_test, main -> query_mysql_tables (production)
  deploy-query-mysql-tables:
    needs: changes
    if: needs.changes.outputs.query_mysql_tables == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine target function
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "FUNCTION_NAME=query_mysql_tables" >> "$GITHUB_ENV"
          else
            echo "FUNCTION_NAME=query_mysql_tables_test" >> "$GITHUB_ENV"
          fi

      - name: Package Lambda
        run: |
          cd 'query_mysql_tables_lambda/'
          zip -r ../query_mysql_tables_lambda.zip .

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://query_mysql_tables_lambda.zip

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

