name: Deploy Lambdas on Merge

on:
  push:
    branches:
      - develop
    paths:
      - 'mysql_tables_sync_lambda/**'
      # - 'src/function-b/**'
      # - 'src/function-c/**'   # Add all your Lambda folders here

permissions:
  id-token: write             # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1                                                    # Your AWS region
  AWS_ROLE_ARN: arn:aws:iam::339712780658:role/github-actions-metadata-sync-role   # Your IAM role ARN

jobs:
  # Determines which Lambda directory actually changed, using a real
  # before/after git diff (dorny/paths-filter) rather than github.event.commits,
  # which is unreliable (often empty) for branch-creation pushes, squash
  # merges, or pushes over 20 commits — see the deploy-lambdas.yml history for
  # why that approach kept causing jobs to skip.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mysql_tables_sync: ${{ steps.filter.outputs.mysql_tables_sync }}
      # function_b: ${{ steps.filter.outputs.function_b }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mysql_tables_sync:
              - 'mysql_tables_sync_lambda/**'
            # function_b:
            #   - 'src/function-b/**'   # Add a filter entry per Lambda folder

  deploy-mysql-tables-sync-test:
    needs: changes
    if: needs.changes.outputs.mysql_tables_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        run: |
          cd 'mysql_tables_sync_lambda/'
          zip -r ../mysql_tables_sync_lambda.zip .

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name mysql_tables_sync_test \
            --zip-file fileb://mysql_tables_sync_lambda.zip

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name mysql_tables_sync_test

